name: keepalive

on:
  schedule:
    - cron: "19 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase to prevent free-tier pause
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://knimfthyttlyttzymdke.supabase.co/rest/v1/catalog?id=eq.data&select=id" \
            -H "apikey: sb_publishable_nixngfur47d9UyHqEG7DCw_e99qezPM")
          echo "Supabase responded: $code"
      - name: Keep this repo active so the schedule never auto-disables
        run: |
          date -u > last_ping.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_ping.txt
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
